name: Timeweb preview events

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [closed]

permissions: {}

jobs:
  record:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.user.login == 'timeweb-cloud-apps[bot]' &&
       github.event.comment.user.id == 152404199 &&
       github.event.comment.user.type == 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, PR scripts, repository token permissions or deployment secrets.
      - name: Record event identifiers
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          number = int(os.environ["PR_NUMBER"])
          assert 1 <= number <= 2147483647
          comment = event.get("comment", {})
          record = {
              "version": 1,
              "event": os.environ["EVENT_NAME"],
              "action": event["action"],
              "pr": number,
              "comment_id": comment.get("id"),
          }
          Path("event.json").write_text(json.dumps(record), encoding="utf-8")
          PY
      - name: Publish identifiers for the trusted router
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timeweb-preview-event
          path: event.json
          if-no-files-found: error
          overwrite: true
          retention-days: 3
