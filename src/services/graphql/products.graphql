fragment ProductFields on Product {
  id
  sku
  name
  description
  indicator
  images
  stock
  producer { id name description aliases }
  group { id name }
  size { length width height unit volumeM3 }
  weight { weight unit }
}

fragment ProductListFields on Product {
  id
  sku
  name
  indicator
  stock
  producer { id name }
}

fragment ProductDetailsFields on Product {
  ...ProductFields
  eans @include(if: $includeEans)
  characteristics { characteristic { id name normalizedName } value }
  pair { ...ProductListFields }
  contents { quantity product { ...ProductListFields } }
  crosses(input: $crossesInput) @include(if: $includeCrosses) { ...ProductListFields }
}

fragment SupplierProductFields on SupplierProduct {
  id
  candidateId
  sku
  producer
  supplier
  names { id supplierProductId name }
}

fragment CatalogueCandidateCrossFields on CatalogueCandidate {
  id
  sku
  producer { id name description }
  product { ...ProductFields }
  supplierProducts { ...SupplierProductFields }
}

fragment CatalogueCandidateReviewFields on CatalogueCandidate {
  id
  sku
  producer { id name description }
  product { ...ProductFields }
  supplierProducts { ...SupplierProductFields }
}

fragment CatalogueCandidateDetailsFields on CatalogueCandidate {
  ...CatalogueCandidateReviewFields
  crosses {
    mapped { ...CatalogueCandidateCrossFields }
    notMapped { ...SupplierProductFields }
  }
}

fragment CatalogueCandidateSearchFields on CatalogueCandidate {
  id
  sku
  producer { id name }
  supplierProducts {
    names { name }
  }
}

query ProductById($id: Int!, $crossesInput: ProductCrossesInput!, $includeCrosses: Boolean!, $includeCatalogueCandidate: Boolean!, $includeEans: Boolean!) {
  products { byId(id: $id) { ...ProductDetailsFields } }
  catalogueCandidates @include(if: $includeCatalogueCandidate) {
    byProductId(productId: $id) { ...CatalogueCandidateReviewFields }
  }
}

query CatalogueSearch($input: CatalogueSearchInput!) {
  catalogue {
    search(input: $input) {
      products {
        total
        items {
          item { ...ProductFields }
          highlights { items { field fragments } }
        }
      }
      catalogues {
        total
        items {
          item { ...CatalogueCandidateSearchFields }
          highlights { items { field fragments } }
        }
      }
    }
  }
}

query ProducerSearch($input: ProducerSearchInput!) {
  producers {
    search(input: $input) {
      id
      name
      description
    }
  }
}

query ProductGroupsSearch($input: SearchProductGroupsInput!) {
  productGroups {
    search(input: $input) { id name normalizedName }
  }
}

query ProductGroupsByIds($ids: [Int!]!) {
  productGroups { byIds(ids: $ids) { id name normalizedName } }
}

query CharacteristicsSearch($input: SearchCharacteristicsInput!) {
  characteristics { search(input: $input) { id name normalizedName } }
}

query CharacteristicsByIds($ids: [Int!]!) {
  characteristics { byIds(ids: $ids) { id name normalizedName } }
}

mutation CharacteristicUpsert($input: UpsertCharacteristicInput!) {
  characteristics { upsert(input: $input) { id name normalizedName } }
}

mutation CharacteristicDelete($id: Int!) {
  characteristics { delete(id: $id) }
}

mutation ProductGroupUpsert($input: UpsertProductGroupInput!) {
  productGroups { upsert(input: $input) { id name normalizedName } }
}

mutation ProductPatch($productId: Int!, $input: PatchProductInput!) {
  products { patch(productId: $productId, input: $input) { id } }
}

mutation ProductCreate($products: [CreateProductInput!]!) {
  products { create(products: $products) { id sku name } }
}

mutation ProductEanCreate($input: ProductEanInput!) {
  productEans { create(input: $input) }
}

mutation ProductEanDelete($input: ProductEanInput!) {
  productEans { delete(input: $input) }
}

query ProducersByIds($ids: [Int!]!) {
  producers {
    byIds(ids: $ids) { id name description }
  }
}

query CatalogueCandidatesForReview($input: CatalogueSearchInput!) {
  catalogue {
    search(input: $input) {
      catalogues {
        total
        items { item { ...CatalogueCandidateReviewFields } }
      }
    }
  }
}

query CatalogueCandidateById($id: UUID!) {
  catalogueCandidates { byId(id: $id) { ...CatalogueCandidateDetailsFields } }
}

query CatalogueCandidateByProductId($productId: Int!) {
  catalogueCandidates { byProductId(productId: $productId) { ...CatalogueCandidateDetailsFields } }
}

mutation CandidateToCatalogue($input: CandidateToCatalogueInput!) {
  catalogueCandidates { candidateToCatalogue(input: $input) { id } }
}

mutation MapCandidateCrosses($input: MaxCandidateCrossesInput!) {
  catalogueCandidates {
    mapCrosses(input: $input) { ...CatalogueCandidateDetailsFields }
  }
}

query ProductAvailableStock($id: Int!, $input: ProductAvailableStocksInput!) {
  products {
    byId(id: $id) {
      id
      availableStock(input: $input)
    }
  }
}

query ProductsAvailableStock($ids: [Int!]!, $input: ProductAvailableStocksInput!) {
  products {
    byIds(ids: $ids) {
      id
      availableStock(input: $input)
    }
  }
}

query ProductPair($id: Int!) {
  products { byId(id: $id) { id pair { ...ProductListFields } } }
}

query ProductContents($id: Int!) {
  products { byId(id: $id) { id contents { quantity product { ...ProductListFields } } } }
}

query ProductCrosses($id: Int!, $input: ProductCrossesInput!) {
  products { byId(id: $id) { id crosses(input: $input) { ...ProductListFields } } }
}

query ProductStorageContents($id: Int!, $input: ProductStorageContentsInput!) {
  products {
    byId(id: $id) {
      id
      storageContents(input: $input) {
        id rowVersion count buyPrice purchaseDatetime
        currency { id code name shortName sign }
        storage { code description location type }
        product { ...ProductListFields }
      }
    }
  }
}

query StorageContentsSearch($input: StorageContentsSearchInput!) {
  storageContents {
    search(input: $input) {
      id rowVersion count buyPrice purchaseDatetime
      currency { id code name shortName sign }
      storage { code description location type }
      product { ...ProductListFields }
    }
  }
}
