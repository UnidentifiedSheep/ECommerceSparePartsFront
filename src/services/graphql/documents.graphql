query AvailableDocuments {
  documents {
    available {
      systemName
      name
      description
      documentGroup
      supportedDocumentTypes
      requestSchema {
        version
        fields {
          name
          type
          control
          required
          label
          labelKey
          description
          descriptionKey
          accepts
          dependency { entityName fieldName }
          nestedSchema { version fields { name type control required label description accepts } }
        }
      }
    }
  }
}

fragment DocumentGenerationRequestFields on DocumentGenerationRequest {
  requestId
  jobId
  status
  documentSystemName
  requesterId
  createdAt
  generatedAt
  expiresAt
  fileLink { url expiresAtUtc }
}

mutation CreateDocumentGenerationRequest($input: CreateGenerationRequestInput!) {
  documents { createGenerationRequest(input: $input) { ...DocumentGenerationRequestFields } }
}

query DocumentById($requestId: UUID!) {
  documents { byId(requestId: $requestId) { ...DocumentGenerationRequestFields } }
}

query DocumentsByIds($requestIds: [UUID!]!) {
  documents { byIds(requestIds: $requestIds) { ...DocumentGenerationRequestFields } }
}

query SearchDocuments($input: SearchDocumentsInput!) {
  documents { search(input: $input) { ...DocumentGenerationRequestFields } }
}
