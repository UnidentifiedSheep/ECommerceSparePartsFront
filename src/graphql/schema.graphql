input SearchJobsInput { systemNames: [String!]! statuses: [JobStatus!]! pagination: PaginationInput! sortBy: [JobSortBy!] }
input SearchJobSchedulesInput { jobSystemNames: [String!]! nextRunFrom: DateTime nextRunTo: DateTime pagination: PaginationInput! sortBy: [JobScheduleSortBy!] }
