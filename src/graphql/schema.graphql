input JobScheduleSortBy { field: JobScheduleSortField! isDescending: Boolean! argument: String }
enum JobScheduleSortField { ID NAME JOB_SYSTEM_NAME NEXT_RUN_AT LAST_QUEUED_AT ENABLED }
input CreateJobInput { systemName: String! inputState: String! maxAttempts: Int! }
