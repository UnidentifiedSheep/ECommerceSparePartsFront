"""The `Any` scalar type represents any valid GraphQL value."""
scalar Any @specifiedBy(url: "https://scalars.graphql.org/chillicream/any.html")

"""
The `DateTime` scalar type represents a date and time with time zone offset information.
"""
scalar DateTime @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"""
The `Decimal` scalar type represents a decimal floating-point number with high precision.
"""
scalar Decimal @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"""The `Duration` scalar type represents a duration of time."""
scalar Duration @specifiedBy(url: "https://scalars.graphql.org/chillicream/duration.html")

"""The `Long` scalar type represents a signed 64-bit integer."""
scalar Long @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"""The `UnsignedInt` scalar type represents an unsigned 32-bit integer."""
scalar UnsignedInt @specifiedBy(url: "https://scalars.graphql.org/chillicream/unsigned-int.html")

"""
The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562.
"""
scalar UUID @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")
